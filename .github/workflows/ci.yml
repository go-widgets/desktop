name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  # Vet, build every package (shell / render / cmd), and enforce a 100%
  # statement-coverage gate on the composition/model logic (the ./shell
  # package). The render + cmd packages are the raw rendering + native binary
  # layers: they draw to a pixel surface / own a D-Bus name, so they are
  # compile-verified and smoke-tested rather than coverage-gated.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - run: go version
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Build (all packages)
        run: CGO_ENABLED=0 go build ./...
      - name: Test (all packages)
        run: CGO_ENABLED=0 go test ./...
      - name: 100% coverage gate (model logic — ./shell)
        # -race requires cgo, so enable it for THIS step only; every other
        # step stays CGO-free.
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./shell/...
          go tool cover -func=cover.out | tail -n 40
          # Fail on ANY line below 100% (a rounded total can hide gaps).
          if go tool cover -func=cover.out | awk '$NF!="100.0%"' | grep -q .; then
            echo "::error::model coverage below 100%"
            go tool cover -func=cover.out | awk '$NF!="100.0%"'
            exit 1
          fi
          echo "model coverage: 100%"

  # Native Windows lane: vet, build every package (the Win32 window path + the
  # native Start Menu source compile here), and run the full test suite — which
  # exercises the windows-tagged source.NewWindows scan and its .lnk/.ico/PE
  # readers against hand-built fixtures (the peer of the macos-latest run that
  # covers the darwin source). Also cross-builds windows/arm64 (the on-VM target)
  # so both Windows architectures stay green. CGO-free throughout.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: Build (all packages)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Test (all packages)
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Cross-build windows/arm64 (the on-VM target)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: arm64

  # The six supported 64-bit targets. amd64/arm64 run the suite natively; the
  # rest run it under qemu-user. All CGO-free.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - run: CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x, qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  # Incremental-present correctness proof: drive the shell's scene.HostRoot (the
  # exact root the windowed backend runs) over a scripted interaction and assert
  # every incremental frame is BYTE-IDENTICAL to a full repaint of the same state
  # (the -capture compositor is the oracle), then measure the presented damage —
  # a launcher keystroke repaints only the west region, a grid scroll only the
  # centre — proving the small-rect path never drops a pixel. Headless + fast, so
  # it runs on every push; the numbers print in the log.
  incremental-render-equality:
    name: live shell (incremental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Byte-identity + damage-measurement proof
        run: CGO_ENABLED=0 go test -run TestHostRootPixelIdentityAndDamage -v ./render/...

  # Live windowed proof: open the desktop shell in a REAL X11 window (via
  # github.com/go-widgets/window, the same path `desktop` with no flags uses)
  # under Xvfb, capture the server framebuffer with ImageMagick's `import`, and
  # assert from sampled pixels that the shell rendered (dock + launcher carry
  # widget content) AND that a notification produced a visible Toast in the
  # window. The notifications daemon owns a name on the session bus, so the test
  # runs under dbus-run-session; icon themes populate the dock. This lane
  # exercises the windowed backend end-to-end — the analogue of
  # go-widgets/window's own live-xvfb lane — and is the CI counterpart of the
  # on-VM capture used to verify the wiring.
  live-shell-windowed:
    name: live shell (windowed, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Install Xvfb + capture + icon themes
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-apps imagemagick dbus adwaita-icon-theme hicolor-icon-theme
      - name: Run the live windowed integration test under Xvfb
        env:
          DESKTOP_X11_INTEGRATION: "1"
        run: |
          xvfb-run -s "-screen 0 1024x768x24" \
            dbus-run-session -- \
            go test -tags=integration -run TestLiveWindowedX11 -v ./cmd/desktop/...
      - name: Upload the captured window as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shell-windowed
          path: cmd/desktop/live-shell-windowed.png
          if-no-files-found: warn

  # Native-macOS proof: compose the shell from the REAL macOS application tree
  # (source.NewDarwin scans /Applications) and drive the EXACT damage-aware root
  # the Cocoa/AppKit backend runs (scene.HostRoot, what `desktop` with no flags
  # hands to window.Backend.Run on darwin, github.com/go-widgets/window v0.6.0).
  # It asserts from sampled pixels that the dock (real app icons) and launcher
  # (real app names) carry content, that one synthesised hover is dispatched and
  # its incremental damage is confined to the launcher region, and uploads the
  # dated PNG. The pure-Go painter render runs headless — no window server /
  # Screen-Recording permission needed — so it is deterministic on macos-latest;
  # the live NSWindow open itself uses the same window.Open→Run path and is
  # proven by running the binary on-device.
  native-cocoa-shell:
    name: native shell (cocoa capture)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Capture the native-macOS shell + assert pixels/input
        env:
          DESKTOP_COCOA_CAPTURE: "1"
          # Absolute path: `go test` runs in the package dir, so a relative path
          # would resolve under cmd/desktop/. The upload step reads docs/ from
          # the workspace root.
          DESKTOP_COCOA_PNG: "${{ github.workspace }}/docs/native-macos-shell-2026-08-10.png"
        run: CGO_ENABLED=0 go test -tags=integration -run TestLiveCocoaShell -v ./cmd/desktop/...
      - name: Upload the captured native shell as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-shell
          path: docs/native-macos-shell-2026-08-10.png
          if-no-files-found: warn
      # On-device proof for the KEYBOARD file operations (⌘C/⌘X/⌘V, ⌘⌥V): drive
      # the same scene.HostRoot with synthetic key events carrying the real ⌘/⌥
      # modifier flags the window v0.12.0 Cocoa backend decodes, over a throwaway
      # temp dir, and assert the files are copied/moved ON DISK — then render the
      # paste-confirm + cut-dimmed frames with the real Inter font.
      - name: Keyboard file-ops proof + confirm/cut captures
        env:
          DESKTOP_COCOA_KEYS: "1"
          DESKTOP_COCOA_KEYS_PNG: "${{ github.workspace }}/docs/native-macos-keyboard-fileops-2026-08-11.png"
          DESKTOP_COCOA_CUT_PNG: "${{ github.workspace }}/docs/native-macos-cut-dimmed-2026-08-11.png"
        run: CGO_ENABLED=0 go test -tags=integration -run TestCocoaKeyboardFileOps -v ./cmd/desktop/...
      - name: Upload the keyboard file-ops captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-keyboard-fileops
          path: docs/native-macos-keyboard-fileops-2026-08-11.png
          if-no-files-found: warn

  # Portability gate: the shell + its browser data source (embed.FS) + the
  # wasmbox backend + the wasmdesk client must all compile to js/wasm, and the
  # client wasm must link. This is the "same source, second target" half of the
  # design — the native binary is covered by the lanes above.
  js-build:
    name: build js/wasm (wasmdesk client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Cross-compile the portable packages + client for js/wasm
        run: GOOS=js GOARCH=wasm CGO_ENABLED=0 go build ./shell/... ./source/... ./render/... ./clients/...
      - name: Link the wasmdesk client wasm
        run: |
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o desktop.wasm ./clients/desktop/
          ls -l desktop.wasm

  # Browser (wasmdesk) proof: build the desktop client to wasm, serve it with the
  # REAL wasmbox client SDK + dev server (a read-only clone of wasmdesk/wasmbox)
  # under COOP/COEP, and drive it with Playwright in headless Chromium — asserting
  # the client renders its scene (from the embedded source) over the real
  # hello/welcome/commit/input wire and that one input round-trip repaints. The
  # composited canvas screenshots are uploaded. wasmbox is only cloned to run it;
  # it is never modified. See clients/desktop/harness/.
  browser-wasmdesk:
    name: browser proof (wasmdesk, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright
          npx playwright install --with-deps chromium
      - name: Run the wasmbox browser proof
        run: bash clients/desktop/harness/run.sh
      - name: Upload the composited canvas captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-wasmdesk
          path: docs/browser-wasmdesk-*.png
          if-no-files-found: warn

  # Hand-drawn-UI guard (blocking): bricolint is a go/analysis analyzer that flags
  # raw painter primitives (FillRect/Stroke*/DrawImage/Text/…) called on a
  # go-widgets/painter receiver in non-test app code, and toolkit.New<Widget>
  # constructors built inside a Draw/Paint/Render method — the tells of chrome
  # rasterised by hand instead of composed from a toolkit widget. A genuine render
  # leaf opts out with `//bricolint:allow <reason>` (reason mandatory). The
  # negative-control step injects a raw primitive into a real Draw method and
  # asserts the guard bites, so a silently-disarmed guard turns CI red.
  bricolint:
    name: guard hand-drawn UI (bricolint)
    runs-on: ubuntu-latest
    env: { GOWORK: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Install bricolint
        run: go install github.com/go-widgets/bricolint/cmd/bricolint@v0.1.0
      - name: Guard against hand-drawn UI
        run: go vet -vettool="$(go env GOPATH)/bin/bricolint" ./...
      - name: Negative control (the guard must bite)
        run: BRICOLINT="$(go env GOPATH)/bin/bricolint" bash hack/bricolint-negative-control.sh
